# GEARS — Private Motor Insurance (Private Car) FormSpec
# Source: gears_research/products_map.md — Motor Insurance section (2026-08)
# Flow:  Quotation Details → Details (Owner/Vehicle/Additional) → Sum Insured/Add-on → Payment
# Entry: introduce/product-list?id=PMOT → hover .item_product → Get quote
#
# ✅ quotation_details: LIVE-VERIFIED 2026-08 (7/7 fields filled on real GEARS,
#    read-back confirmed: applicant_type/condition/id_type/id_number/
#    sst_number/vehicle_number/place). condition options: REGISTERED /
#    NEW REGISTERED / REGISTERED-TRANSFER OWNER (no "USED").
#    NOTE: condition=NEW REGISTERED → vehicleNumber disabled (new car, no plate).
#    idNumber: maxlength=12 + digitonly directive → fill 12 digits WITHOUT
#    dashes ('881212145678'); '881212-14-5678' gets truncated to 10 digits
#    → client-side validation "Please provide a valid ID number."
# ✅ details (owner/address/vehicle/drivers): LIVE-CAPTURED 2026-08.
#    Real IDs use proposal* prefix (owner/address) + vehicle* (vehicle) +
#    insured_*_0 (named driver). Many fields AUTO-populated by portal after
#    vehicle lookup (chassis/engine/capacity/make/year/nvic) — omit from data.
#    Continue button on Details = button:has-text('Continue') (SPA, no nav).
#    Autocomplete options (live): proposalTitle=Madam/Mr/Ms;
#    proposalMarital=Married/Single; proposalStateApplicant=Malaysian states;
#    vehicleBodyType=SEDAN/SALOON/SUV/SPORT/...; safetyFeature=ABS & Airbags*.
#    marital/country/model/ncd_Per/marketValue start DISABLED (Angular gating)
#    → force_enable: true where operator must fill.

product_id: "PMOT"
product_name: "Private Motor Insurance (Private Car)"
portal: "great_eastern_gears"
version: "2.0"
entry_url: "/MY/AgencySales/quotations/introduce"

sections:
  - name: quotation_details
    description: "Step 1 — applicant type & vehicle identifiers"
    submit: "button:has-text('Continue')"
    fields:
      - name: applicant_type
        selector: "input[name='radioBasic']"
        type: radio
        required: true
        options: { values: ["individual", "corporate"] }

      # autocomplete: initially disabled → driver must removeAttribute('disabled')
      # then fill + native click mat-option (JS el.click() does NOT update Angular model)
      - name: condition
        selector: "#condition"
        type: text
        required: true
        options:
          autocomplete: true
          force_enable: true        # input starts disabled (Angular binding)
          autocomplete_option: "mat-option"
          hint: "REGISTERED / NEW REGISTERED / REGISTERED-TRANSFER OWNER"

      - name: id_type
        selector: "#idType"
        type: text
        required: true
        options:
          autocomplete: true
          force_enable: true        # input starts disabled (Angular binding)
          autocomplete_option: "mat-option"
          hint: "NRIC / Passport"

      - name: id_number
        selector: "#idNumber"
        type: text
        required: true
        options: { hint: "12 digits, NO dashes (maxlength=12 + digitonly)" }

      - name: sst_number
        selector: "#sstNumber"
        type: text
        required: false

      - name: tin_number
        selector: "#tinNumber"
        type: text
        required: false
        options: { force_enable: true, hint: "optional; starts disabled" }

      - name: vehicle_number
        selector: "#vehicleNumber"
        type: text
        required: true
        transform: uppercase

      - name: place
        selector: "#place"
        type: text
        required: true
        options:
          autocomplete: true
          autocomplete_option: "mat-option"
          hint: "State (autocomplete)"

  - name: owner
    description: "Step 2a — proposer / owner details"
    submit: "button:has-text('Continue')"
    fields:
      - name: salutation
        selector: "#proposalTitle"
        type: text
        required: true
        options: { autocomplete: true, autocomplete_option: "mat-option", hint: "Mr / Ms / Madam" }

      - name: fullname
        selector: "#proposalFullName"
        type: text
        required: true

      - name: gender
        selector: "input[name='radioBasic']"
        type: radio
        required: true
        options: { values: ["M", "F"], hint: "value is M/F (NOT Male/Female)" }

      - name: dob
        selector: "#proposalDOB"
        type: text
        required: false
        options: { hint: "AUTO-populated from NRIC (DD MMM YYYY) — omit from data" }

      - name: nationality
        selector: "#proposalNation"
        type: text
        required: false
        options: { autocomplete: true, autocomplete_option: "mat-option", hint: "AUTO-populated (Malaysia) — omit from data" }

      - name: marital_status
        selector: "#proposalMarital"
        type: text
        required: true
        options: { autocomplete: true, autocomplete_option: "mat-option", force_enable: true, hint: "Single / Married (starts disabled)" }

      - name: years_driving_exp
        selector: "#year_experience"
        type: text
        required: true

      - name: mobile
        selector: "#proposalMobileNumber"
        type: text
        required: true

      - name: home_phone
        selector: "#proposalHomeNumber"
        type: text
        required: false

      - name: email
        selector: "#proposalEmail"
        type: text
        required: true

      - name: pds_consent
        selector: "mat-checkbox:has-text(\"acknowledge and declare\") input[type=checkbox]"
        type: checkbox
        required: true
        options: { hint: "Acknowledge PDS & PDPN consent (email checkbox). ID is unstable (#mat-checkbox-N) — use :has-text." }

  - name: address
    description: "Step 2b — mailing address (same page, after owner)"
    submit: "button:has-text('Continue')"
    fields:
      - name: postcode
        selector: "#proposalPostalCode"
        type: text
        required: true

      - name: state
        selector: "#proposalStateApplicant"
        type: text
        required: true
        options: { autocomplete: true, autocomplete_option: "mat-option", hint: "Malaysian states (KUALA LUMPUR, SELANGOR...)" }

      - name: country
        selector: "#proposalCountryApplicant"
        type: text
        required: false
        options: { hint: "AUTO-locked (disabled) — omit from data" }

      - name: address1
        selector: "#proposalAddressLine1"
        type: text
        required: true

      - name: address2
        selector: "#proposalAddressLine2"
        type: text
        required: false

      - name: address3
        selector: "#proposalAddressLine3"
        type: text
        required: false

      - name: address4
        selector: "#proposalAddressLine4"
        type: text
        required: false

  - name: vehicle
    description: "Step 2c — vehicle details (same page; mostly AUTO after plate lookup)"
    submit: "button:has-text('Continue')"
    fields:
      - name: detail_vehicle_number
        selector: "#detailVehicleNumber"
        type: text
        required: false
        options: { hint: "AUTO (read-only copy from step 1) — omit from data" }

      - name: vehicle_indicator
        selector: "#vehicleIndicator"
        type: text
        required: false
        options: { hint: "AUTO (IMPORTED/LOCAL) — omit from data" }

      - name: coverage_type
        selector: "#vehicleCoverageType"
        type: text
        required: false
        options: { hint: "AUTO (COMPREHENSIVE) — omit from data" }

      - name: body_type
        selector: "#vehicleBodyType"
        type: text
        required: true
        options: { autocomplete: true, autocomplete_option: "mat-option", hint: "SEDAN / SALOON / SUV / SPORT..." }

      - name: chassis_no
        selector: "#chassisNumber"
        type: text
        required: false
        options: { hint: "AUTO from vehicle lookup — omit from data" }

      - name: engine_no
        selector: "#engineNumber"
        type: text
        required: false
        options: { hint: "AUTO from vehicle lookup — omit from data" }

      - name: engine_capacity
        selector: "#engineCapacity"
        type: text
        required: false
        options: { hint: "AUTO from vehicle lookup — omit from data" }

      - name: make
        selector: "#vehicleMake"
        type: text
        required: false
        options: { autocomplete: true, autocomplete_option: "mat-option", hint: "AUTO (HONDA) — omit from data" }

      - name: model
        selector: "#vehicleModel"
        type: text
        required: false
        options: { hint: "AUTO/disabled (lookup may fail for fake plates) — omit from data" }

      - name: use_of_vehicle
        selector: "#useVehicle"
        type: text
        required: false
        options: { hint: "AUTO — omit from data" }

      - name: seating_capacity
        selector: "#seatingCapacity"
        type: text
        required: true

      - name: year_manufacture
        selector: "#yearManufacture"
        type: text
        required: false
        options: { hint: "AUTO from vehicle lookup — omit from data" }

      - name: market_value
        selector: "#marketValue"
        type: text
        required: false
        options: { hint: "filled via 'Check market value' button (disabled until then)" }

      - name: nvic
        selector: "#nvic"
        type: text
        required: false
        options: { hint: "AUTO (NVIC code) — omit from data" }

      - name: ncd_transfer
        selector: "#ncdTransfer"
        type: text
        required: false
        options: { hint: "pre-filled with vehicle number; NCD transfer from previous plate" }

      - name: ncd_percent
        selector: "#ncd_Per"
        type: text
        required: false
        options: { hint: "filled via 'Check NCD' button (disabled until then)" }

      - name: number_claims
        selector: "#number_Claims"
        type: text
        required: false
        options: { hint: "AUTO/disabled — omit from data" }

      - name: coverage_duration
        selector: "#coverageDuration"
        type: text
        required: false
        options: { hint: "AUTO (12 months) — omit from data" }

      - name: anti_theft_device
        selector: "#antiTheftDevice"
        type: text
        required: false
        options: { autocomplete: true, autocomplete_option: "mat-option" }

      - name: safety_feature
        selector: "#safetyFeature"
        type: text
        required: false
        options: { autocomplete: true, autocomplete_option: "mat-option", hint: "ABS & Airbags (more than 2) / ABS (No Airbags)..." }

      - name: garage
        selector: "#garage"
        type: text
        required: false
        options: { autocomplete: true, autocomplete_option: "mat-option" }

      - name: hire_purchase
        selector: "input[name='radioBasic']"
        type: radio
        required: true
        options: { values: ["Y", "N"], hint: "Is vehicle financed under hire purchase? (radios btn_0/btn_1, same name=radioBasic)" }

  - name: drivers
    description: "Step 2d — additional named driver(s) (same page)"
    submit: "button:has-text('Continue')"
    fields:
      - name: all_drivers_cover
        selector: "#mat-checkbox-2-input"
        type: checkbox
        required: false
        options: { hint: "Optional cover: All Drivers +MYR 20.00" }

      # Named driver rows appear after clicking "Add driver" (button:has-text('Add driver'))
      # Fields use insured_*_0 / insured_*_1 naming; selectors not yet captured.
      - name: named_driver_1
        selector: "#insured_fullName_0"
        type: text
        required: false
        status: needs_capture
